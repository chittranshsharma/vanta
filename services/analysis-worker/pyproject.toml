[project]
name = "vanta-analysis-service"
version = "0.1.0"
description = "Vanta analysis worker (Upgrade B): typed, provenance-carrying data jobs. Never a second source of truth."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
