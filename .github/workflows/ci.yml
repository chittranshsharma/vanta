name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Build must succeed with no Supabase credentials; the client fails closed.
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""

  analysis-service:
    name: Python analysis service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
